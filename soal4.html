<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jawaban Soal 5</title>
</head>
<body style="margin: 0; padding: 0; background: transparent; font-family: 'Segoe UI', Arial, sans-serif;">

<div style="width: 100%; box-sizing: border-box; padding: 4px;">
  <textarea id="soal5" placeholder="Tuliskan jawabanmu di sini..." style="
    width: 100%; height: 120px; padding: 10px; border: 1.5px solid #bfd8f6; border-radius: 10px;
    background: #ffffff; color: #19365b; font-family: inherit; font-size: 13px; line-height: 1.5;
    box-sizing: border-box; resize: vertical; outline-color: #1769c2; box-shadow: 0 3px 8px rgba(0,0,0,0.04);
  "></textarea>
  <div id="st" style="font-size: 11px; margin-top: 4px; color: #1769c2; text-align: right; font-weight: 600;"></div>
</div>

<script>
(function() {
  const input = document.getElementById("soal5");
  const st = document.getElementById("st");

  input.value = localStorage.getItem("elkpd_suhu_soal5") || "";

  input.addEventListener("input", () => {
    localStorage.setItem("elkpd_suhu_soal5", input.value.trim());
    st.textContent = "💾 Jawaban Soal 5 tersimpan di perangkat";
  });
})();
</script>

</body>
</html>
