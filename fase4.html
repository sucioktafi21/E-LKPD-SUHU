<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabel Hasil Pengamatan - Pengaruh Suhu</title>
</head>
<body style="margin: 0; padding: 0; background-color: transparent;">

<div style="
  font-family: 'Segoe UI', Arial, sans-serif;
  width: 100%;
  max-width: 800px;
  margin: 10px auto;
  padding: 18px 22px;
  background: linear-gradient(145deg, #ffffff, #f0f7ff);
  border: 1px solid #d5e7ff;
  border-radius: 18px;
  box-shadow: 0 6px 20px rgba(35, 100, 180, 0.1);
  color: #19365b;
  box-sizing: border-box;
">

  <!-- HEADER UTAMA -->
  <div style="
    background: linear-gradient(135deg, #1769c2, #63a7f5);
    padding: 12px 18px;
    border-radius: 12px;
    margin-bottom: 16px;
    color: white;
    text-align: center;
  ">
    <div style="font-size: 26px; margin-bottom: 2px;">🌡️</div>
    <div style="font-size: 18px; font-weight: 800; letter-spacing: 0.5px;">
      TABEL HASIL PENGAMATAN PRAKTIKUM
    </div>
    <div style="font-size: 12px; margin-top: 2px; opacity: 0.95;">
      Virtual Laboratory · Pengaruh Perubahan Suhu
    </div>
  </div>

  <div style="overflow-x: auto; margin-bottom: 14px; border-radius: 12px; border: 1px solid #bfd8f6;">
    <table style="width: 100%; border-collapse: collapse; background: #ffffff; font-size: 13px; text-align: center;">
      <thead>
        <tr style="background: #e6f0fa; color: #1769c2;">
          <th style="padding: 10px 12px; border-bottom: 2px solid #bfd8f6; width: 34%;">Perlakuan</th>
          <th style="padding: 10px 12px; border-bottom: 2px solid #bfd8f6; width: 33%;">Suhu (°C)</th>
          <th style="padding: 10px 12px; border-bottom: 2px solid #bfd8f6; width: 33%;">Warna Larutan</th>
        </tr>
      </thead>
      <tbody>
        <!-- KONDISI AWAL -->
        <tr style="border-bottom: 1px solid #eef5fc;">
          <td style="padding: 10px 8px; font-weight: 700; background: #f8fbff; text-align: left;">Kondisi Awal</td>
          <td style="padding: 6px;"><input type="number" step="any" id="suhu_awal" placeholder="Contoh: 25" style="width: 90%; padding: 8px; border: 1px solid #bfd8f6; border-radius: 8px; text-align: center; font-family: inherit; font-size: 13px;"></td>
          <td style="padding: 6px;"><input type="text" id="warna_awal" placeholder="Warna awal..." style="width: 90%; padding: 8px; border: 1px solid #bfd8f6; border-radius: 8px; text-align: center; font-family: inherit; font-size: 13px;"></td>
        </tr>
        
        <!-- SUHU DINAIKKAN -->
        <tr style="border-bottom: 1px solid #eef5fc;">
          <td style="padding: 10px 8px; font-weight: 700; background: #f8fbff; text-align: left;">Suhu Dinaikkan</td>
          <td style="padding: 6px;"><input type="number" step="any" id="suhu_naik" placeholder="Contoh: 80" style="width: 90%; padding: 8px; border: 1px solid #bfd8f6; border-radius: 8px; text-align: center; font-family: inherit; font-size: 13px;"></td>
          <td style="padding: 6px;"><input type="text" id="warna_naik" placeholder="Warna setelah dipanaskan..." style="width: 90%; padding: 8px; border: 1px solid #bfd8f6; border-radius: 8px; text-align: center; font-family: inherit; font-size: 13px;"></td>
        </tr>
        
        <!-- SUHU DITURUNKAN -->
        <tr>
          <td style="padding: 10px 8px; font-weight: 700; background: #f8fbff; text-align: left;">Suhu Diturunkan</td>
          <td style="padding: 6px;"><input type="number" step="any" id="suhu_turun" placeholder="Contoh: 5" style="width: 90%; padding: 8px; border: 1px solid #bfd8f6; border-radius: 8px; text-align: center; font-family: inherit; font-size: 13px;"></td>
          <td style="padding: 6px;"><input type="text" id="warna_turun" placeholder="Warna setelah didinginkan..." style="width: 90%; padding: 8px; border: 1px solid #bfd8f6; border-radius: 8px; text-align: center; font-family: inherit; font-size: 13px;"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- STATUS PENYIMPANAN OTOMATIS -->
  <div id="st" role="status" aria-live="polite" style="
    min-height: 20px; font-size: 13px; margin-top: 8px; text-align: center; font-weight: 600; line-height: 1.5;
  "></div>

  <!-- FOOTER -->
  <div style="text-align: center; margin-top: 10px; font-size: 11px; color: #7189a7;">
    ✦ Hasil pengamatan suhu tersimpan otomatis di perangkat · Lanjut ke slide berikutnya ✦
  </div>

</div>

<script>
(function () {
  const ids = [
    "suhu_awal", "warna_awal",
    "suhu_naik", "warna_naik",
    "suhu_turun", "warna_turun"
  ];

  const st = document.getElementById("st");

  function simpanLokal() {
    try {
      ids.forEach(id => {
        const el = document.getElementById(id);
        if (el) localStorage.setItem("elkpd_suhu_" + id, el.value.trim());
      });
      return true;
    } catch (e) {
      return false;
    }
  }

  function muatLokal() {
    try {
      ids.forEach(id => {
        const el = document.getElementById(id);
        const val = localStorage.getItem("elkpd_suhu_" + id);
        if (el && val !== null) el.value = val;
      });
    } catch (e) {
      st.textContent = "⚠️ Penyimpanan otomatis tidak tersedia di browser ini.";
      st.style.color = "#d9534f";
    }
  }

  function simpanOtomatis() {
    if (simpanLokal()) {
      st.textContent = "💾 Tabel pengamatan Suhu tersimpan otomatis di perangkat.";
      st.style.color = "#1769c2";
    }
  }

  ids.forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener("input", simpanOtomatis);
      el.addEventListener("change", simpanOtomatis);
    }
  });

  muatLokal();
})();
</script>

</body>
</html>
